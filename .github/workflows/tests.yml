name: MLflow Platform Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  platform-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Check Docker and Docker Compose versions
        run: |
          docker --version
          docker-compose --version

      - name: Validate platform configuration
        run: |
          chmod +x ./validate-platform.sh
          ./validate-platform.sh

      - name: Build and start platform (core services)
        run: |
          cd platform/compose
          docker-compose -f docker-compose.core.yml -f docker-compose.dev.override.yml \
            --env-file ../env/dev.env up -d --build

      - name: Wait for services to be healthy
        run: |
          echo "Waiting for services to become healthy..."
          timeout 120 sh -c 'until docker ps | grep -q "mlflow-dev-db.*healthy"; do sleep 2; done'
          echo "Database is healthy"
          
          # Give MLflow services time to fully start
          sleep 30

      - name: Run comprehensive tests
        run: |
          chmod +x ./test-platform.sh
          ./test-platform.sh

      - name: Test MLflow API
        run: |
          # Test experiments endpoint
          curl -f http://localhost:5011/api/2.0/mlflow/experiments/search?max_results=10
          
          # Test health endpoints
          curl -f http://localhost:5500/health
          curl -f http://localhost:5011/health

      - name: Display container logs on failure
        if: failure()
        run: |
          echo "=== DB Logs ==="
          docker logs mlflow-dev-db --tail 100
          echo "=== Artifact Logs ==="
          docker logs mlflow-dev-artifact --tail 100
          echo "=== Tracking Logs ==="
          docker logs mlflow-dev-tracking --tail 100

      - name: Stop and cleanup
        if: always()
        run: |
          cd platform/compose
          docker-compose -f docker-compose.core.yml -f docker-compose.dev.override.yml \
            --env-file ../env/dev.env down -v

  legacy-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true  # Legacy tests are optional
    
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Test legacy backend-storage (deprecated)
        run: |
          echo "Testing legacy setup for backwards compatibility..."
          if [ -f ./backend-storage/docker-compose.yaml ]; then
            echo "MYSQL_ROOT_PASSWORD=testpassword" >> ./backend-storage/.env
            echo "MYSQL_DATABASE=mlflow" >> ./backend-storage/.env
            echo "MYSQL_USER=mlflow" >> ./backend-storage/.env
            echo "MYSQL_PASSWORD=testpassword" >> ./backend-storage/.env
            
            docker-compose -f ./backend-storage/docker-compose.yaml up -d || true
            sleep 20
            docker-compose -f ./backend-storage/docker-compose.yaml down || true
          else
            echo "Legacy setup not found - skipping"
          fi 